<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nala Soo Xidhiidh - Kaah News</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="js/main.js" defer></script>
</head>
<body class="flex flex-col min-h-screen">
  <nav class="bg-white shadow">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="text-2xl font-bold">Kaah News</div>
      <div class="hidden md:flex space-x-4">
        <a href="index.html" class="hover:text-blue-600">Wararka</a>
        <a href="about.html" class="hover:text-blue-600">Nagu Saabsan</a>
        <a href="contact.html" class="hover:text-blue-600">Nala Soo Xidhiidh</a>
      </div>
      <button class="md:hidden" onclick="toggleMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
    <div id="mobile-menu" class="md:hidden hidden px-4 pb-4">
      <a href="index.html" class="block py-1">Wararka</a>
      <a href="about.html" class="block py-1">Nagu Saabsan</a>
      <a href="contact.html" class="block py-1">Nala Soo Xidhiidh</a>
    </div>
  </nav>

  <main class="flex-grow container mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold mb-4">Nala Soo Xidhiidh</h1>
    <form class="space-y-4 max-w-lg">
      <div>
        <label for="name" class="block mb-1">Magaca</label>
        <input id="name" type="text" class="w-full border px-3 py-2 rounded" placeholder="Magacaaga">
      </div>
      <div>
        <label for="email" class="block mb-1">Iimaylka</label>
        <input id="email" type="email" class="w-full border px-3 py-2 rounded" placeholder="email@example.com">
      </div>
      <div>
        <label for="message" class="block mb-1">Farriin</label>
        <textarea id="message" class="w-full border px-3 py-2 rounded" rows="5" placeholder="Farriintaada"></textarea>
      </div>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Dir</button>
    </form>
  </main>

  <footer class="bg-gray-100 py-4 text-center">
    <p>&copy; 2025 Kaah News. All rights reserved.</p>
  </footer>
</body>
</html>
